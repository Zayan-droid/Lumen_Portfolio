<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waitlist Admin — Lumin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="internal.css">
    <style>
        .admin-page {
            background: #F4F6F9;
            min-height: 100vh;
            padding-top: calc(var(--nav-height) + 40px);
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        .admin-header {
            margin-bottom: 40px;
        }

        .admin-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--color-navy);
            margin-bottom: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--color-white);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(10, 31, 68, 0.04);
            border: 1px solid rgba(10, 31, 68, 0.06);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--color-navy);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--color-slate);
            font-weight: 500;
        }

        .table-container {
            background: var(--color-white);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(10, 31, 68, 0.04);
            border: 1px solid rgba(10, 31, 68, 0.06);
            overflow: hidden;
        }

        .table-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(10, 31, 68, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-navy);
        }

        .refresh-btn {
            padding: 8px 16px;
            background: var(--color-blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: #0077CC;
            transform: translateY(-1px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #F8F9FA;
        }

        th {
            padding: 16px 24px;
            text-align: left;
            font-size: 0.8125rem;
            font-weight: 700;
            color: var(--color-slate);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 16px 24px;
            border-top: 1px solid rgba(10, 31, 68, 0.06);
            font-size: 0.9375rem;
            color: var(--color-navy);
        }

        tr:hover {
            background: #F8F9FA;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-pending {
            background: #FFF5D1;
            color: #E5A31E;
        }

        .status-contacted {
            background: #E6F3FF;
            color: var(--color-blue);
        }

        .status-onboarded {
            background: #E0F8EC;
            color: #1E9E63;
        }

        .action-btn {
            padding: 6px 12px;
            margin: 0 4px;
            border: none;
            border-radius: 6px;
            font-size: 0.8125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-update {
            background: #E6F3FF;
            color: var(--color-blue);
        }

        .btn-update:hover {
            background: var(--color-blue);
            color: white;
        }

        .btn-delete {
            background: #FEEDED;
            color: #D33D3D;
        }

        .btn-delete:hover {
            background: #D33D3D;
            color: white;
        }

        .empty-state {
            padding: 60px 24px;
            text-align: center;
            color: var(--color-slate);
        }

        .loading {
            padding: 60px 24px;
            text-align: center;
            color: var(--color-slate);
        }
        
        @media (max-width: 1024px) {
            .admin-container {
                padding: 32px 24px;
            }
            
            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 16px;
            }
        }
        
        @media (max-width: 768px) {
            .admin-page {
                padding-top: calc(var(--nav-height) + 32px);
            }
            
            .admin-container {
                padding: 24px 20px;
            }
            
            .admin-title {
                font-size: 2rem;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            
            .stat-card {
                padding: 20px;
            }
            
            .stat-value {
                font-size: 1.75rem;
            }
            
            .table-header {
                padding: 16px 20px;
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            
            .refresh-btn {
                width: 100%;
            }
            
            .table-container {
                overflow-x: auto;
            }
            
            table {
                min-width: 800px;
            }
            
            th, td {
                padding: 12px 16px;
                font-size: 0.875rem;
            }
        }
        
        @media (max-width: 600px) {
            .admin-container {
                padding: 20px 16px;
            }
            
            .admin-title {
                font-size: 1.75rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .stat-card {
                padding: 16px;
            }
            
            .stat-value {
                font-size: 1.5rem;
            }
            
            .stat-label {
                font-size: 0.8125rem;
            }
            
            .table-title {
                font-size: 1.125rem;
            }
            
            th, td {
                padding: 10px 12px;
                font-size: 0.8125rem;
            }
            
            .action-btn {
                padding: 4px 8px;
                font-size: 0.75rem;
                margin: 2px;
            }
        }
        
        @media (max-width: 480px) {
            .admin-header {
                margin-bottom: 24px;
            }
            
            .stats-grid {
                margin-bottom: 24px;
            }
            
            table {
                min-width: 700px;
            }
        }
    </style>
</head>
<body class="admin-page">

    <nav id="main-nav" class="nav nav--static">
        <div class="nav__inner">
            <a href="index.html" class="nav__brand">
                <img src="logo blue.png" alt="Lumin Logo" class="nav__logo-img">
            </a>
            <ul class="nav__links">
                <li><a href="features.html">Full Features</a></li>
                <li><a href="students.html">For Students</a></li>
                <li><a href="teachers.html">For Teachers</a></li>
                <li><a href="parents.html">For Parents</a></li>
                <li><a href="ai.html">AI Features</a></li>
            </ul>
            <a href="waitlist.html" class="nav__cta">Join Waitlist</a>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h1 class="admin-title">Waitlist Dashboard</h1>
            <p style="color: var(--color-slate);">Manage schools interested in Lumin</p>
        </div>

        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="stat-total">-</div>
                <div class="stat-label">Total Schools</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-pending">-</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-contacted">-</div>
                <div class="stat-label">Contacted</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-onboarded">-</div>
                <div class="stat-label">Onboarded</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-students">-</div>
                <div class="stat-label">Total Students</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-cities">-</div>
                <div class="stat-label">Cities</div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2 class="table-title">Waitlist Entries</h2>
                <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
            </div>
            <div id="table-content">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <script src="transitions.js"></script>
    <script src="admin.js"></script>
</body>
</html>
